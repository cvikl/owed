# Owed on the shared box. One container on the existing Caddy network so the shared Caddy can reverse_proxy to it by name.
services:
  owed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: owed
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
      PORT: "8787"
    volumes:
      - owed-data:/data
    networks: [deploy_default]
volumes:
  owed-data:
networks:
  deploy_default:
    external: true
